name: Sync Upstream Submodules

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update submodules
        id: update
        run: |
          CHANGES=""

          git submodule foreach --quiet '
            NAME="$name"
            BEFORE=$(git rev-parse HEAD)
            git fetch origin main --quiet
            git checkout origin/main --quiet
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              COUNT=$(git log --oneline "$BEFORE..$AFTER" | wc -l | tr -d " ")
              echo "${NAME}: ${COUNT} new commit(s)" >> /tmp/submodule-changes.txt
            fi
          '

          if [ -f /tmp/submodule-changes.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "changes<<EOF"
              cat /tmp/submodule-changes.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync upstream submodules (${{ github.event.repository.updated_at && format('{0}', github.run_id) || 'manual' }})"
          title: "chore: sync upstream submodules (${{ github.event.schedule && 'weekly' || 'manual' }})"
          body: |
            ## Submodule Updates

            The following submodules have new upstream commits:

            ```
            ${{ steps.update.outputs.changes }}
            ```

            Auto-generated by [sync-upstream workflow](.github/workflows/sync-upstream.yml).
          branch: chore/sync-submodules
          delete-branch: true
          labels: dependencies
